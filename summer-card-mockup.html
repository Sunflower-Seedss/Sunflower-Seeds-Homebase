<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hideo Card Mockup</title>
  <style>
    /* ============================================================
       PAGE / SCENE
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 8px;
    }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      position: relative;
      width: 620px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(200, 190, 80, 0.28);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.04) inset;
    }

    /* Background image layer */
    .card-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://i.ibb.co/JjCcNybR/beach-wave-3.png');
      background-size: cover;
      background-position: center;
      filter: blur(1px) brightness(0.56) saturate(0.85);
      transform: scale(1.05); /* avoids blur edge bleed */
    }

    /* Tinted overlay — yellow #FFE9AB, slightly transparent */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,240,195,0.38) 0%, rgba(255,240,195,0.18) 45%, rgba(255,240,195,0) 65%), linear-gradient(135deg, rgba(255,232,160,0.26) 0%, rgba(255,216,140,0.22) 100%);
    }

    /* All card content sits above the bg layers */
    .card-inner {
      position: relative;
      z-index: 2;
      padding: 20px 20px 16px 20px;
    }

    /* ============================================================
       TOP ROW: portrait + text
       ============================================================ */
    .card-top {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .portrait {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(180, 165, 60, 0.28);
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
    }

    .card-text {
      flex: 1;
      padding-top: 2px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2B1902;
      margin-bottom: 9px;
      line-height: 1.3;
      letter-spacing: -0.01em;
      transition: color 0.25s, text-shadow 0.25s;
    }
    .card-desc {
      font-size: 0.83rem;
      color: rgba(40, 28, 0, 0.88);
      line-height: 1.55;
      font-weight: 500;
    }

    /* Top-right profile pip */
    .card-pip {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 234, 158, 0.75);
      border: 1px solid rgba(180, 155, 30, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2c1f00;
      font-size: 0.75rem;
    }

    /* ============================================================
       TAGS ROW
       ============================================================ */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }
    .tag {
      font-size: 0.78rem;
      padding: 4px 13px;
      border-radius: 20px;
      background: rgba(255, 236, 160, 0.82);
      border: 1px solid rgba(190, 150, 30, 0.35);
      color: #2c1f00;
      cursor: default;
      user-select: none;
      font-weight: 500;
    }
    .tag:first-child {
      background: rgba(255, 228, 140, 0.94);
      border-color: rgba(160, 135, 20, 0.45);
      color: #1e1500;
      font-weight: 600;
    }

    /* ============================================================
       FOOTER ROW
       ============================================================ */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(140, 115, 0, 0.2);
      padding-top: 12px;
    }
    .card-author {
      font-size: 0.78rem;
      color: #2B1902;
      font-weight: 800;
      transition: color 0.25s, text-shadow 0.25s;
    }

    /* ============================================================
       CARD HOVER
       ============================================================ */
    .card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: scale(1.025);
      box-shadow:
        0 12px 40px rgba(0,0,0,0.65),
        0 0 0 1px rgba(255,255,255,0.07) inset;
    }
    .card:hover .card-title {
      color: #1a1000;
      text-shadow: 0 0 6px rgba(255, 255, 240, 0.95), 0 0 16px rgba(255, 210, 60, 0.7), 0 0 32px rgba(200, 150, 0, 0.35);
    }
    .card:hover .card-author {
      color: rgba(30, 20, 0, 0.95);
      text-shadow: 0 0 5px rgba(255, 255, 240, 0.9), 0 0 14px rgba(255, 210, 60, 0.6), 0 0 26px rgba(200, 150, 0, 0.3);
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 248, 180, 0.55);
      border: 1px solid rgba(160, 135, 20, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      color: rgba(44, 31, 0, 0.75);
      transition: background 0.15s;
    }
    .action-icon:hover { background: rgba(255, 240, 120, 0.85); }
    .card-chat-count {
      font-size: 0.82rem;
      color: #f0eaff;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: 4px;
      background: #07384A;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 12px 4px 9px;
      border-radius: 20px;
      font-weight: 600;
    }
    .chat-icon {
      font-size: 0.9rem;
      opacity: 0.85;
    }    }
    .chat-icon {
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
